blueprint:
  name: Charge control - turn off charger when idle (periodic + min on-time)
  description: >
    Turns off a charger switch when its power stays below a threshold for a given duration.
    Uses periodic evaluation and a wait_template (so it works even if power never rises above the threshold).
    Includes a minimum on-time (default 5 minutes).

  domain: automation
  homeassistant:
    min_version: 2024.4.0

  input:
    power_sensor:
      name: Power sensor
      selector:
        entity:
          filter:
            - domain: sensor
          multiple: false

    charger_switch:
      name: Charger switch
      selector:
        entity:
          filter:
            - domain: switch
          multiple: false

    threshold_w:
      name: Threshold (W)
      default: 3
      selector:
        number:
          min: 0.0
          max: 1000.0
          step: 0.1
          unit_of_measurement: W
          mode: box

    below_for:
      name: Must stay below for
      default:
        minutes: 10
      selector:
        duration: {}

    min_on_time:
      name: Minimum on-time
      default:
        minutes: 5
      selector:
        duration: {}

mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: homeassistant
    event: start

variables:
  power_entity: !input power_sensor
  switch_entity: !input charger_switch
  threshold: !input threshold_w

condition:
  - condition: state
    entity_id: !input charger_switch
    state: "on"

  # Minimum on-time (state condition supports "for")
  - condition: state
    entity_id: !input charger_switch
    state: "on"
    for: !input min_on_time

action:
  # Wait until power has been below threshold continuously for below_for
  - wait_template: >
      {{ (states(power_entity) | float(999999)) < (threshold | float(0)) }}
    for: !input below_for
    timeout: "00:00:00"
    continue_on_timeout: false

  - service: switch.turn_off
    target:
      entity_id: !input charger_switch
